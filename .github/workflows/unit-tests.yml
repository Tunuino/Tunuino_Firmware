name: Firmware protocol unit tests
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    name: Native protocol tests (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute dispatcher tests
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          mkdir -p build/tests
          "$CC" -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ifirmware/include \
            unit_tests/test_dispatch.c \
            firmware/src/frame.c \
            firmware/src/identity.c \
            firmware/src/live_data.c \
            firmware/src/map_read.c \
            firmware/src/calibration.c \
            firmware/src/dispatch.c \
            -lm -o build/tests/test_dispatch
          ./build/tests/test_dispatch
      - name: Compile and execute trigger scope tests
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          "$CC" -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ifirmware/include unit_tests/test_scope.c firmware/src/*.c \
            -lm -o build/tests/test_scope
          ./build/tests/test_scope
      - name: Compile and execute service persistence tests
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          "$CC" -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ifirmware/include unit_tests/test_service.c firmware/src/*.c \
            -lm -o build/tests/test_service
          ./build/tests/test_service
      - name: Compile and execute lambda guard tests
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          "$CC" -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ifirmware/include unit_tests/test_lambda_guard.c firmware/src/*.c \
            -lm -o build/tests/test_lambda_guard
          ./build/tests/test_lambda_guard
      - name: Compile and execute ignition angle lock tests
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          "$CC" -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ifirmware/include unit_tests/test_ignition_lock.c firmware/src/*.c \
            -lm -o build/tests/test_ignition_lock
          ./build/tests/test_ignition_lock
      - name: Compile and execute pressure acquisition tests
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          "$CC" -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ifirmware/include unit_tests/test_pressure.c firmware/src/*.c \
            -lm -o build/tests/test_pressure
          ./build/tests/test_pressure
      - name: Compile and execute analog input filter tests
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          "$CC" -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ifirmware/include unit_tests/test_input_filter.c firmware/src/*.c \
            -lm -o build/tests/test_input_filter
          ./build/tests/test_input_filter
      - name: Compile and execute primary input filter tests
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          "$CC" -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ifirmware/include unit_tests/test_primary_input.c firmware/src/*.c \
            -lm -o build/tests/test_primary_input
          ./build/tests/test_primary_input
      - name: Compile and execute CAM input filter tests
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          "$CC" -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ifirmware/include unit_tests/test_cam_input.c firmware/src/*.c \
            -lm -o build/tests/test_cam_input
          ./build/tests/test_cam_input
      - name: Compile and execute VSS tests
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          "$CC" -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ifirmware/include unit_tests/test_vss.c firmware/src/*.c \
            -lm -o build/tests/test_vss
          ./build/tests/test_vss
      - name: Compile and execute CAM 2 input tests
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          "$CC" -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ifirmware/include unit_tests/test_cam2.c firmware/src/*.c \
            -lm -o build/tests/test_cam2
          ./build/tests/test_cam2
